name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      ref: ${{ steps.metadata.outputs.ref }}
      pr_number: ${{ steps.metadata.outputs.pr_number }}
      candidate_digest: ${{ steps.candidate-image.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = pull_request ]; then
            pr_number=$EVENT_PR
            labels=$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
          else
            # Dispatch always checkouts main first, then re-resolves that version's
            # merged release SHA. Do not require GITHUB_REF to be main: a failed
            # stable run's YAML is frozen on that SHA, so recovery must be able to
            # run a fixed workflow file from another branch while publication still
            # operates on the original merged commit. Production still approves.
            pr_number=$(gh pr list --base main --head "release/$version" --state merged --limit 1 --json number --jq '.[0].number // ""')
            test -n "$pr_number"
            release_ref=$(gh pr view "$pr_number" --json mergeCommit --jq '.mergeCommit.oid // ""')
            test -n "$release_ref"
            git fetch --no-tags origin "$release_ref"
            git checkout --detach "$release_ref"
            test "$(node -p "require('./package.json').version")" = "$version"
            labels=$(gh pr view "$pr_number" --json labels --jq '[.labels[].name] | join(",")')
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
      - id: policy
        env:
          LABELS: ${{ steps.metadata.outputs.labels }}
          VERSION: ${{ steps.metadata.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tags=$(git tag --list 'v*' | grep -vx "v$VERSION" | tr '\n' ' ' || true)
          prereleases=$(node scripts/release/cli.mjs prerelease-tags)
          node scripts/release/cli.mjs policy --labels "$LABELS" --head stable-source --tags "$tags" --exclude "$prereleases"
      - name: Match the committed release version
        env:
          COMMITTED: ${{ steps.metadata.outputs.version }}
          EXPECTED: ${{ steps.policy.outputs.version }}
        run: test "$COMMITTED" = "$EXPECTED"
      - run: node scripts/release.mjs check
      # The candidate image is what verification approved, so publication promotes that exact
      # manifest rather than rebuilding it. Resolving the digest here, rather than in publish, is
      # what lets the rebuild job below stay skipped on the normal path. A missing candidate is not
      # an error: it is the recovery case, and the rebuild fallback covers it.
      - id: candidate-image
        name: Resolve the verified candidate image digest
        env:
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          image="ghcr.io/$OWNER/lurkloot-cli"
          registry_token=$(curl --fail --silent --show-error \
            --user "$ACTOR:$GHCR_TOKEN" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$OWNER/lurkloot-cli:pull" \
            | jq -er '.token')
          digest=$(curl --fail --silent --show-error --head \
            --header "Authorization: Bearer $registry_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/$OWNER/lurkloot-cli/manifests/candidate-$VERSION" 2>/dev/null \
            | tr -d '\r' \
            | sed -n 's/^Docker-Content-Digest: //Ip' || true)
          case "$digest" in
            sha256:*) echo "promoting $image@$digest" ;;
            *) digest=""; echo "no candidate-$VERSION image; publication will rebuild" ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # The extension is not rebuilt here. Publication promotes the candidate prerelease in place, so the
  # signed artifacts it already carries are the ones that ship; publish downloads them back.

  # The CLI image follows the same rule: the approved job retags the verified candidate manifest by
  # digest. This rebuild runs only when that candidate is gone, which is a recovery path.
  # GitHub validates the called workflow's permission ceiling before evaluating its skipped
  # publish job. The build matrix itself explicitly reduces packages back to none.
  docker:
    needs: resolve
    if: needs.resolve.outputs.candidate_digest == ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}
      image_tag: ${{ needs.resolve.outputs.version }}
      artifact_prefix: stable-docker-${{ github.run_id }}-${{ github.run_attempt }}
      export_oci: true

  site-build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-site
        with:
          channel: production
      - uses: actions/upload-artifact@v7
        with:
          name: stable-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/site/dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, docker, site-build]
    # `docker` is skipped whenever a candidate image exists, and a skipped dependency would
    # otherwise skip this job with it.
    if: >-
      !cancelled() &&
      needs.resolve.result == 'success' &&
      needs.site-build.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
      pull-requests: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_PR: ${{ needs.resolve.outputs.pr_number }}
      CANDIDATE_DIGEST: ${{ needs.resolve.outputs.candidate_digest }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: sync-token
        name: Validate branch synchronization credentials before publication
        env:
          RELEASE_SYNC_APP_ID: ${{ secrets.RELEASE_SYNC_APP_ID }}
          RELEASE_SYNC_APP_PRIVATE_KEY: ${{ secrets.RELEASE_SYNC_APP_PRIVATE_KEY }}
        run: node scripts/release/cli.mjs app-token
      # Only the rebuild fallback produces these; digest promotion needs no local image.
      - if: needs.docker.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: stable-docker-${{ github.run_id }}-${{ github.run_attempt }}-oci-*
          path: docker-images
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: stable-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-artifact
      # The candidate published these already signed. Downloading them back, rather than rebuilding,
      # is what makes the shipped bits the reviewed bits. SHA256SUMS covers every shipped file.
      - name: Recover the reviewed release assets
        run: |
          mkdir release-assets
          gh release download "v$VERSION" --dir release-assets
          (cd release-assets && sha256sum -c SHA256SUMS)
      - name: Verify the release asset set
        run: node scripts/release/cli.mjs assert-assets --assets release-assets --version "$VERSION"
      # No tag is created here. It was created during candidacy at the release branch head, and the
      # main ruleset's strict status-check policy guarantees that tree is what landed on main.
      - name: Promote the candidate prerelease to the stable release
        run: |
          node scripts/release/cli.mjs notes --version "$VERSION" --out notes.md
          {
            echo
            echo "## Install the Chrome zip"
            echo
            echo "To load this pre-release in Chrome from the zip, see [Installing a pre-release build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install-prerelease.md)."
          } >> notes.md
          # Promotion strips the candidate marker, so a recovery checkout of the merged
          # SHA cannot satisfy promote-release's ownership check. Skip when already stable.
          if [ "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = true ]; then
            node scripts/release/cli.mjs promote-release --pr "$RELEASE_PR" --version "$VERSION" --notes notes.md
          else
            echo "v$VERSION is already the stable release"
          fi
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified candidate image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/lurkloot-cli
        run: |
          major="${VERSION%%.*}"
          minor="${VERSION%.*}"
          if [ -n "$CANDIDATE_DIGEST" ]; then
            # The normal path. The candidate manifest is the one the required checks passed
            # against, so the stable tags point at those exact bytes; nothing is rebuilt.
            source="$IMAGE@$CANDIDATE_DIGEST"
            desired="$CANDIDATE_DIGEST"
          else
            # Recovery only, when the candidate image no longer exists. A rebuild of the same
            # source is not bit-identical, so its digest is not the reviewed one.
            staging="release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            cd docker-images
            sha256sum -c image-amd64.tar.sha256
            sha256sum -c image-arm64.tar.sha256
            for arch in amd64 arm64; do
              docker load --input "image-$arch.tar"
              docker tag "$IMAGE:$VERSION-$arch" "$IMAGE:$staging-$arch"
              docker push "$IMAGE:$staging-$arch"
            done
            docker buildx imagetools create --tag "$IMAGE:$staging" \
              "$IMAGE:$staging-amd64" "$IMAGE:$staging-arm64"
            source="$IMAGE:$staging"
            desired=$(docker buildx imagetools inspect "$IMAGE:$staging" --format '{{.Manifest.Digest}}')
            cd ..
          fi
          existing=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$desired" ]; then
            if [ -n "$CANDIDATE_DIGEST" ]; then
              echo "refusing to move immutable image $IMAGE:$VERSION from $existing to $desired" >&2
              exit 1
            fi
            # A rerun that had to rebuild found the immutable tag already published. That digest
            # stays authoritative; the moving aliases are pointed at it rather than at the rebuild.
            echo "$IMAGE:$VERSION already published; aliasing the published digest $existing"
            source="$IMAGE@$existing"
            desired="$existing"
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:$minor" --tag "$IMAGE:$major" --tag "$IMAGE:latest" \
            "$source"
          published=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          test "$published" = "$desired"
      - name: Publish to the Chrome Web Store
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: >-
          node scripts/release/cli.mjs cws-release
          --version "$VERSION" --package "release-assets/lurkloot-$VERSION-chrome.zip"
      - uses: ./.github/actions/deploy-site
        with:
          channel: production
          directory: site-artifact
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Report stable publication
        run: >-
          gh pr comment "$RELEASE_PR"
          --body "Released v$VERSION. Chrome Web Store review was requested with automatic publication: https://chrome.google.com/webstore/devconsole/5fdc4582-d1e8-4714-819e-d4bdcee7da79/aobaackpofkghaejdnnmpmeaiaoibhdn"

  # Synchronization is deliberately outside publish. It verifies the merged `develop` tree, which is
  # not the tree being released, so a develop-side failure must not be able to wedge a release that
  # has already shipped: this leaves a completed release plus one retryable job, instead of a rerun
  # that repeats the entire publication before failing in the same place. Its own checkout is clean,
  # so nothing has to be restored before switching branches.
  sync:
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: sync-token
        name: Mint the dedicated synchronization credential
        env:
          RELEASE_SYNC_APP_ID: ${{ secrets.RELEASE_SYNC_APP_ID }}
          RELEASE_SYNC_APP_PRIVATE_KEY: ${{ secrets.RELEASE_SYNC_APP_PRIVATE_KEY }}
        run: node scripts/release/cli.mjs app-token
      - name: Merge main directly into develop with the dedicated App
        env:
          SYNC_TOKEN: ${{ steps.sync-token.outputs.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$SYNC_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          # Playwright browsers live in the runner cache, not the worktree, so they survive the
          # branch switch inside sync-branches. Candidate and PR verify jobs already install
          # Chromium; this checkout may be an older release SHA whose defaultVerify does not.
          pnpm install --frozen-lockfile
          pnpm --filter @lurkloot/extension exec playwright install chromium
          node scripts/release/cli.mjs sync-branches --remote origin
