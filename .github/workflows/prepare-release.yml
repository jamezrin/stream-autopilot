name: Prepare release

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  # A label only validates and previews. It never modifies the pull request it is applied to;
  # the release branch is cut once that pull request actually merges, by the cut job below.
  # Pushes to a labelled head rebuild too, so the candidate always describes the commit that would
  # be released rather than whichever commit happened to be current when the label went on.
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      (
      ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      startsWith(github.event.label.name, 'release/')) ||
      (github.event.action == 'synchronize' &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'release/'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # The checkout lives in a subdirectory, so the workspace root is not a git repository and gh
    # cannot infer the repo from a remote.
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      action: ${{ steps.policy.outputs.action }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      # pull_request_target supplies a write token, so only trusted base-branch tooling is executed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: policy
        name: Resolve the live release policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          labels=$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
          tags=$(git -C trusted tag --list 'v*' | tr '\n' ' ')
          prereleases=$(node trusted/scripts/release/cli.mjs prerelease-tags)
          if ! node trusted/scripts/release/cli.mjs policy --labels "$labels" --head "$HEAD_REF" --tags "$tags" --exclude "$prereleases"; then
            gh pr comment "$PR" --body "Release preparation is blocked: only one of \`release/patch\`, \`release/minor\`, or \`release/major\` may be applied."
            exit 1
          fi
      - name: Report a removed release label
        if: steps.policy.outputs.action == 'orphan'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body "All release labels were removed. Merging this pull request will no longer cut a release."

  preview:
    needs: validate
    if: needs.validate.outputs.action == 'prepare'
    permissions:
      contents: write
      packages: write
      pull-requests: write
      statuses: write
      # The candidate's attest job emits build provenance; a reusable workflow's permission
      # ceiling is validated against the caller.
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      trusted_ref: ${{ github.event.pull_request.base.sha }}
      version: ${{ needs.validate.outputs.version }}
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  cut:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release/') &&
      contains(join(github.event.pull_request.labels.*.name, ','), 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_REPO: ${{ github.repository }}
    outputs:
      version: ${{ steps.policy.outputs.version }}
      release_pr: ${{ steps.open.outputs.release_pr }}
      release_sha: ${{ steps.open.outputs.release_sha }}
    steps:
      # The merge commit is already on main, so there is no untrusted tree here and a single
      # checkout serves as both the tooling source and the branch point.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: policy
        name: Resolve the live release policy
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          labels=$(jq -r '[.pull_request.labels[].name] | join(",")' "$GITHUB_EVENT_PATH")
          tags=$(git tag --list 'v*' | tr '\n' ' ')
          prereleases=$(node scripts/release/cli.mjs prerelease-tags)
          node scripts/release/cli.mjs policy --labels "$labels" --head "$HEAD_REF" --tags "$tags" --exclude "$prereleases"
      - name: Refuse to overwrite another pull request's release branch
        env:
          VERSION: ${{ steps.policy.outputs.version }}
          TRIGGER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          body=$(gh pr list --head "release/$VERSION" --state open --json body --jq '.[0].body // ""')
          if [ -n "$body" ] && ! printf '%s' "$body" | grep -qF "via #$TRIGGER."; then
            gh pr comment "$TRIGGER" --body "Release \`$VERSION\` is already owned by another pull request. Release or close that candidate first."
            exit 1
          fi
      - name: Bump the workspace
        env:
          VERSION: ${{ steps.policy.outputs.version }}
        run: node scripts/release/cli.mjs prepare-workspace --version "$VERSION" --date "$(date -u +%F)"
      # `main` already carrying the bump means the release merged but was never approved, and the
      # cut has nothing to open a pull request from. Say so here rather than failing later inside
      # `gh pr create` with "no commits between main and release/X.Y.Z".
      - name: Detect a release that is already bumped on main
        env:
          VERSION: ${{ steps.policy.outputs.version }}
          TRIGGER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add package.json packages/*/package.json packages/site/src/changelog.json
          git diff --cached --quiet || exit 0
          gh pr comment "$TRIGGER" --body "\`main\` already carries the version bump for \`$VERSION\`, so there is no release pull request to cut. This is the abandoned-release case: the release pull request merged but its \`production\` approval was never given. Dispatch **Release** manually to finish publishing \`$VERSION\`; do not re-apply a release label."
          echo "main already carries $VERSION; dispatch Release to finish publication" >&2
          exit 1
      - id: open
        name: Push the release branch and open its pull request
        env:
          VERSION: ${{ steps.policy.outputs.version }}
          LABEL: ${{ steps.policy.outputs.label }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TRIGGER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "release/$VERSION"
          git add package.json packages/*/package.json packages/site/src/changelog.json
          git diff --cached --quiet || git commit -m "chore(release): bump version to $VERSION"
          git push --force "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY" \
            "HEAD:refs/heads/release/$VERSION"
          gh pr create --base main --head "release/$VERSION" \
            --title "chore(release): bump version to $VERSION" \
            --label "$LABEL" \
            --body "Version bump and changelog date for $VERSION, cut from \`$HEAD_REF\` via #$TRIGGER. Merge with a merge commit to publish." \
            || gh pr edit "release/$VERSION" --title "chore(release): bump version to $VERSION" --add-label "$LABEL"
          release_pr=$(gh pr view "release/$VERSION" --json number --jq .number)
          echo "release_pr=$release_pr" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The release pull request is opened with GITHUB_TOKEN, which never dispatches workflow runs, so
  # its first candidate build is driven from here rather than from a pull request event.
  candidate:
    needs: cut
    permissions:
      contents: write
      packages: write
      pull-requests: write
      statuses: write
      # The candidate's attest job emits build provenance; a reusable workflow's permission
      # ceiling is validated against the caller.
      id-token: write
      attestations: write
    uses: ./.github/workflows/build-release-candidate.yml
    with:
      ref: ${{ needs.cut.outputs.release_sha }}
      trusted_ref: ${{ github.event.pull_request.merge_commit_sha }}
      version: ${{ needs.cut.outputs.version }}
      pr_number: ${{ fromJSON(needs.cut.outputs.release_pr) }}
    secrets:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
