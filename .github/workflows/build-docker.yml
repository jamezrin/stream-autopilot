name: Build CLI Docker image

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      image_tag:
        description: Optional registry tag, independent from the committed workspace version
        type: string
        default: ""
      artifact_prefix:
        type: string
        default: docker-digest
      push:
        type: boolean
        default: false
      export_oci:
        description: Upload verified OCI archives without writing to the registry
        type: boolean
        default: false
    outputs:
      image_tag:
        value: ${{ jobs.publish.outputs.image_tag }}
      image_digest:
        value: ${{ jobs.publish.outputs.image_digest }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lurkloot-cli

jobs:
  build:
    permissions:
      contents: read
      packages: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.version != ''
        with:
          node-version: 24
      - name: Set the release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.mjs prepare-workspace --version "$VERSION" --date "$(date -u +%F)"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true
          push: false
          # Candidate images use a mutable candidate-X.Y.Z tag without overlaying the committed
          # workspace version. Stable builds default the registry tag to the supplied version.
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || inputs.version || 'validation' }}-${{ matrix.arch }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.arch }}.tar
      - name: Checksum OCI artifact
        run: cd /tmp && sha256sum image-${{ matrix.arch }}.tar > image-${{ matrix.arch }}.tar.sha256
      - if: inputs.push || inputs.export_oci
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-oci-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar*
          retention-days: 1
      - name: Summarize Docker build
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSHED: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '## Docker build\n\n- Platform: `%s`\n- Publication requested: `%s`\n' "$PLATFORM" "$PUSHED" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.publish.outputs.image_tag }}
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_prefix }}-oci-*
          path: images
          merge-multiple: true
      - name: Verify OCI artifacts
        working-directory: images
        run: sha256sum -c image-amd64.tar.sha256 && sha256sum -c image-arm64.tar.sha256
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the immutable version-specific tags are set here. The moving aliases `X.Y`, `X` and
      # `latest` are deliberately left alone: release.yml's publish job sets them after the single
      # human approval, so an unapproved build can never move `latest`.
      - id: publish
        name: Push the version tags
        env:
          IMAGE_TAG: ${{ inputs.image_tag || inputs.version }}
        run: |
          test -n "$IMAGE_TAG"
          docker load --input images/image-amd64.tar
          docker push "$IMAGE_NAME:$IMAGE_TAG-amd64"
          docker load --input images/image-arm64.tar
          docker push "$IMAGE_NAME:$IMAGE_TAG-arm64"
          docker buildx imagetools create --tag "$IMAGE_NAME:$IMAGE_TAG" \
            "$IMAGE_NAME:$IMAGE_TAG-amd64" "$IMAGE_NAME:$IMAGE_TAG-arm64"
          echo "image_tag=$IMAGE_NAME:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          # The manifest digest is what provenance is attested against, and what stable publication
          # later promotes. The tag is mutable; this is not.
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          echo "image_digest=$digest" >> "$GITHUB_OUTPUT"
