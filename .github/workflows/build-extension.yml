name: Build extension artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      trusted_ref:
        description: Trusted commit used only to prepare integrity-pinned signing tooling
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      artifact_name:
        type: string
        default: extension-release-assets
      sign_crx:
        type: boolean
        default: false
    secrets:
      CRX_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  prepare-signer:
    if: inputs.sign_crx
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit trusted signer ref
        env:
          TRUSTED_REF: ${{ inputs.trusted_ref }}
        run: test -n "$TRUSTED_REF"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Prepare signer from the trusted integrity-pinned lockfile
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter lurkloot deploy --legacy --dev signer
          test "$(node -p "require('$GITHUB_WORKSPACE/signer/node_modules/crx3/package.json').version")" = 2.0.0
          tar -czf signer.tar.gz signer
          sha256sum signer.tar.gz > SIGNER_SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-signer
          path: |
            signer.tar.gz
            SIGNER_SHA256
          if-no-files-found: error
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.3.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Set the release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.mjs prepare-workspace --version "$RELEASE_VERSION" --date "$(date -u +%F)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm zip && pnpm zip:firefox
      - name: Normalize reproducible ZIP artifacts
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          output=packages/extension/.output
          mkdir release-assets
          chrome_zip=$(find "$output" -maxdepth 1 -name "*-$version-chrome.zip" -print -quit)
          firefox_zip=$(find "$output" -maxdepth 1 -name "*-$version-firefox.zip" -print -quit)
          sources_zip=$(find "$output" -maxdepth 1 -name "*-$version-sources.zip" -print -quit)
          test -n "$chrome_zip" -a -n "$firefox_zip" -a -n "$sources_zip"
          normalize_zip() {
            source=$1
            destination=$2
            directory=$(mktemp -d)
            unzip -q "$source" -d "$directory"
            find "$directory" -exec touch -h -t 198001010000 {} +
            (cd "$directory" && find . -type f -print0 | sort -z | xargs -0 zip -X -q "$GITHUB_WORKSPACE/$destination")
            rm -rf "$directory"
          }
          normalize_zip "$chrome_zip" "release-assets/lurkloot-$version-chrome.zip"
          normalize_zip "$firefox_zip" "release-assets/lurkloot-$version-firefox.zip"
          normalize_zip "$sources_zip" "release-assets/lurkloot-$version-firefox-sources.zip"
      - name: Checksum unsigned build output
        working-directory: release-assets
        run: sha256sum lurkloot-* > UNSIGNED_SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-unsigned
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [build, prepare-signer]
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.prepare-signer.result == 'success' || needs.prepare-signer.result == 'skipped')
    runs-on: ubuntu-latest
    # Environments collapse to two: `preview` (no required reviewer) and `production` (required
    # reviewer). Signing produces an artifact but distributes nothing, so it belongs behind the
    # `preview` credential boundary that holds CRX_PRIVATE_KEY, not behind a human approval. The
    # single human approval gate lives on the `publish` job in release.yml, which is what actually
    # publishes. Validation calls (sign_crx: false) do unsigned verification and must not pause on
    # any environment.
    environment: ${{ inputs.sign_crx && 'preview' || '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}-unsigned
          path: release-assets
      - uses: actions/setup-node@v7
        if: inputs.sign_crx
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        if: inputs.sign_crx
        with:
          name: ${{ inputs.artifact_name }}-signer
          path: signer-artifact
      - name: Verify and unpack pinned local signer
        if: inputs.sign_crx
        working-directory: signer-artifact
        run: |
          sha256sum -c SIGNER_SHA256
          tar -xzf signer.tar.gz -C "$GITHUB_WORKSPACE"
          test "$(node -p "require('$GITHUB_WORKSPACE/signer/node_modules/crx3/package.json').version")" = 2.0.0
      - name: Verify unsigned build output
        working-directory: release-assets
        run: sha256sum -c UNSIGNED_SHA256SUMS
      - name: Build signed CRX3
        if: inputs.sign_crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          test -n "$CRX_PRIVATE_KEY" || { echo "CRX_PRIVATE_KEY is not configured" >&2; exit 1; }
          key="$RUNNER_TEMP/lurkloot.pem"
          trap 'rm -f "$RUNNER_TEMP/lurkloot.pem"' EXIT
          printf '%s' "$CRX_PRIVATE_KEY" > "$key"
          unset CRX_PRIVATE_KEY
          chrome_zip=$(find release-assets -maxdepth 1 -name 'lurkloot-*-chrome.zip' -print -quit)
          test -n "$chrome_zip"
          version=${chrome_zip#release-assets/lurkloot-}
          version=${version%-chrome.zip}
          mkdir chrome-mv3
          unzip -q "$chrome_zip" -d chrome-mv3
          # GitHub's Ubuntu runner permits a root network namespace. The signer and
          # key exist before entry, so this performs no image/package acquisition.
          sudo unshare --net --mount-proc -- \
            node signer/node_modules/crx3/bin/crx3.js -p "$key" -o "release-assets/lurkloot-$version-chrome.crx" -- chrome-mv3
      - name: Generate checksums
        working-directory: release-assets
        run: |
          rm UNSIGNED_SHA256SUMS
          sha256sum lurkloot-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Summarize extension artifacts
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SIGN_CRX: ${{ inputs.sign_crx }}
        run: |
          printf '## Extension artifacts\n\n- Artifact: `%s`\n- Signed CRX: `%s`\n- Chrome ZIP: `%s`\n' "$ARTIFACT_NAME" "$SIGN_CRX" "$(find release-assets -maxdepth 1 -name 'lurkloot-*-chrome.zip' -printf '%f' -quit)" >> "$GITHUB_STEP_SUMMARY"
