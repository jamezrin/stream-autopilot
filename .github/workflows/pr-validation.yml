name: Pull request validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The store screenshot dashboard tests drive a real Chromium against local
      # HTML fixtures, and the runner ships no Playwright browsers. Do not add
      # --with-deps: the runner image already carries every Chromium system
      # library, so it only pulls CJK font packages that these DOM-assertion
      # tests never render, at the cost of a 1-8 minute apt fetch.
      - run: pnpm --filter @lurkloot/extension exec playwright install chromium
      - run: pnpm release:check
      - run: pnpm check

  extension:
    uses: ./.github/workflows/build-extension.yml
    with:
      sign_crx: false

  docker:
    # The called workflow's publish job declares packages:write. GitHub validates a reusable
    # workflow's permission ceiling at compile time even though publish is skipped here
    # (push: false), so the calling job must grant that ceiling. The build matrix job caps itself
    # back to packages:none, so no PR code runs with write access.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      push: false
