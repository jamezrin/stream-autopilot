name: Build release candidate

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      trusted_ref:
        type: string
        required: true
      version:
        type: string
        required: true
      pr_number:
        type: number
        required: true
    secrets:
      CRX_PRIVATE_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  pending:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Mark the candidate head as pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node scripts/release/cli.mjs candidate-checks
          --sha "$SHA" --state pending --target-url "$TARGET_URL"

  verify:
    needs: pending
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.26.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The store screenshot dashboard tests drive a real Chromium against local
      # HTML fixtures, and the runner ships no Playwright browsers. Do not add
      # --with-deps: the runner image already carries every Chromium system
      # library, so it only pulls CJK font packages that these DOM-assertion
      # tests never render, at the cost of a 1-8 minute apt fetch.
      - run: pnpm --filter @lurkloot/extension exec playwright install chromium
      - run: pnpm check

  extension:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build-extension.yml
    with:
      ref: ${{ inputs.ref }}
      trusted_ref: ${{ inputs.trusted_ref }}
      # The label-time candidate builds the source pull request's tree, which has no version bump
      # yet, so the version is overlaid here to keep artifact names and the prerelease consistent.
      version: ${{ inputs.version }}
      artifact_name: candidate-extension-${{ inputs.version }}
      sign_crx: true
    secrets:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}

  docker:
    needs: verify
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      ref: ${{ inputs.ref }}
      image_tag: candidate-${{ inputs.version }}
      artifact_prefix: candidate-docker-${{ inputs.version }}
      push: true

  # Provenance is emitted where the bits are produced, not where they are promoted: the stable
  # release retags this exact image digest and republishes these exact asset bytes, so one
  # attestation covers both the candidate and the release. Keeping it out of build-extension.yml
  # and build-docker.yml matters — those are also called by pr-validation.yml, and a reusable
  # workflow's permission ceiling is validated in the caller even when the job is skipped, which
  # would force `id-token: write` onto pull-request validation.
  attest:
    needs: [extension, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: candidate-extension-${{ inputs.version }}
          path: release-assets
      - name: Attest the signed extension artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-assets/lurkloot-*
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the candidate image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/lurkloot-cli
          subject-digest: ${{ needs.docker.outputs.image_digest }}
          push-to-registry: true

  publish:
    needs: [verify, extension, docker]
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_ref }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: candidate-extension-${{ inputs.version }}
          path: release-assets
      - name: Render candidate release notes
        working-directory: candidate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node ../trusted/scripts/release/cli.mjs notes --version "$VERSION" --out ../notes.md --pending true
          {
            echo
            echo "## Install the Chrome zip"
            echo
            echo "To load this pre-release in Chrome from the zip, see [Installing a pre-release build]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/v$VERSION/docs/install-prerelease.md)."
          } >> ../notes.md
      - name: Create or refresh the owned GitHub prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.ref }}
        run: >-
          node trusted/scripts/release/cli.mjs publish-candidate
          --pr "$PR" --version "$VERSION" --sha "$SHA"
          --assets release-assets --notes notes.md

  site:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/site-deploy.yml
    with:
      channel: prerelease
      ref: ${{ inputs.ref }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  status:
    needs: [publish, site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Update the candidate status comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.ref }}
          URL: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
        run: >-
          node scripts/release/cli.mjs candidate-comment
          --pr "$PR" --version "$VERSION" --sha "$SHA" --state ready --url "$URL"

  gate:
    if: always()
    needs: [verify, extension, docker, attest, publish, site, status]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record the required candidate result on its head SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.ref }}
          TARGET_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY: ${{ needs.verify.result }}
          EXTENSION: ${{ needs.extension.result }}
          DOCKER: ${{ needs.docker.result }}
          ATTEST: ${{ needs.attest.result }}
          PUBLISH: ${{ needs.publish.result }}
          SITE: ${{ needs.site.result }}
          STATUS: ${{ needs.status.result }}
        run: |
          state=success
          for result in "$VERIFY" "$EXTENSION" "$DOCKER" "$ATTEST" "$PUBLISH" "$SITE" "$STATUS"; do
            test "$result" = success || state=failure
          done
          node scripts/release/cli.mjs candidate-checks \
            --sha "$SHA" --state "$state" --target-url "$TARGET_URL"
          test "$state" = success
